[project]
name = "myproject"
version = "0.1.0"
description = "AI-assistert uttrekk, strukturering og analyse av P&ID/SCD (Huldra) — sommerstudentprosjekt for Wisting-digitalisering"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "scipy>=1.13",
    "numpy>=1.26",
    "streamlit>=1.36",
    "networkx>=3.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "altair>=5",
    "plotly>=5.20",
    "pillow>=10.0",
    "scikit-learn>=1.4",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "pypdfium2>=4.30",
    "neqsim>=3.0",
]

[project.optional-dependencies]
ocr = []
# Valgfritt: operatør-brief og system-sammendrag kan kjøres mot en Anthropic-
# modell i stedet for malen. Aktiveres av ANTHROPIC_API_KEY; uten pakken
# faller begge tilbake på den deterministiske malen.
anthropic = ["anthropic>=0.40"]
